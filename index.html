<script>
  async function init() {
    const container = document.getElementById('report-container');
    const select = document.getElementById('dateSelect');

    try {
      const res = await fetch('dates.json');
      if (!res.ok) throw new Error('Could not load dates.json');

      let dates = await res.json();

      // Sort newest first
      dates.sort((a, b) => b.localeCompare(a));

      // Clear the select
      select.innerHTML = '';

      // Get today's date in local time (YYYY-MM-DD)
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const todayStr = `${year}-${month}-${day}`;

      let defaultDate = dates[0] || null;

      dates.forEach(date => {
        const option = document.createElement('option');
        option.value = date;
        option.textContent = date;

        if (date === todayStr) {
          option.selected = true;
          defaultDate = date;
        }

        select.appendChild(option);
      });

      // If today is not in the list, select the newest available date
      if (defaultDate && defaultDate !== todayStr) {
        select.value = defaultDate;
      }

      if (defaultDate) {
        loadReport(defaultDate);
      } else {
        container.innerHTML = '<div class="error">No dates found in dates.json</div>';
      }

    } catch (err) {
      console.error(err);
      container.innerHTML = `<div class="error">Error loading dates: ${err.message}</div>`;
    }
  }

  async function loadReport(date) {
    const container = document.getElementById('report-container');
    container.innerHTML = '<div class="loading">Loading report…</div>';

    try {
      const response = await fetch(`reports/${date}.html`);
      if (!response.ok) throw new Error('Report not found');
      const html = await response.text();
      container.innerHTML = html;
    } catch (err) {
      container.innerHTML = `<div class="error">No report found for ${date}</div>`;
    }
  }

  // Start
  init();
</script>
