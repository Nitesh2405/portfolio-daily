<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyEquities Daily Portfolio</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #e5e5e5;
      margin: 0;
      padding: 20px;
    }
    #login-screen {
      max-width: 360px;
      margin: 100px auto;
      text-align: center;
    }
    #login-screen input {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 6px;
      color: white;
      font-size: 16px;
    }
    #login-screen button {
      width: 100%;
      padding: 12px;
      background: #22c55e;
      border: none;
      border-radius: 6px;
      color: black;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    #login-screen button:hover {
      background: #16a34a;
    }
    .error-msg {
      color: #ef4444;
      margin-top: 10px;
      display: none;
    }
    #main-content {
      display: none;
    }
    header {
      max-width: 1100px;
      margin: 0 auto 30px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
    }
    h1 { margin: 0; font-size: 1.4rem; }
    select {
      background: #1a1a1a;
      color: white;
      border: 1px solid #444;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 15px;
    }
    .key {
      display: flex;
      gap: 12px;
      font-size: 13px;
      color: #aaa;
      flex-wrap: wrap;
    }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 4px;
    }
    .green { background: #22c55e; }
    .amber { background: #f59e0b; }
    .red { background: #ef4444; }
    .grey { background: #6b7280; }
    #report-container {
      max-width: 1100px;
      margin: 0 auto;
      min-height: 300px;
    }
    .message {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <h2>EasyEquities Portfolio</h2>
    <p style="color:#aaa">Enter password to continue</p>
    <input type="password" id="password" placeholder="Password" autofocus>
    <button onclick="checkPassword()">Unlock</button>
    <div class="error-msg" id="error-msg">Incorrect password</div>
  </div>

  <!-- MAIN CONTENT (hidden until password is correct) -->
  <div id="main-content">
    <header>
      <h1>EasyEquities Daily Portfolio</h1>
      <div>
        <label for="dateSelect">Date: </label>
        <select id="dateSelect">
          <option>Loading...</option>
        </select>
      </div>
      <div class="key">
        <span><span class="dot green"></span>Buy Zone</span>
        <span><span class="dot amber"></span>Near</span>
        <span><span class="dot red"></span>Sell / Trim</span>
        <span><span class="dot grey"></span>Hold</span>
      </div>
    </header>

    <div id="report-container">
      <div class="message">Loading...</div>
    </div>
  </div>

  <script>
    // ========== CHANGE YOUR PASSWORD HERE ==========
    const CORRECT_PASSWORD = "Ng2405@Gh2026";
    // ===============================================

    function checkPassword() {
      const input = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');

      if (input === CORRECT_PASSWORD) {
        // Save login for this browser session
        sessionStorage.setItem('portfolioAuth', 'true');
        showMainContent();
      } else {
        errorMsg.style.display = 'block';
      }
    }

    function showMainContent() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
      start(); // load the reports
    }

    // Check if already logged in this session
    if (sessionStorage.getItem('portfolioAuth') === 'true') {
      showMainContent();
    }

    // Allow pressing Enter
    document.getElementById('password').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') checkPassword();
    });

    // ========== Original report loading code ==========
    async function start() {
      const select = document.getElementById('dateSelect');
      const container = document.getElementById('report-container');

      try {
        const response = await fetch('dates.json');
        const dates = await response.json();

        dates.sort((a, b) => b.localeCompare(a));
        select.innerHTML = '';

        const now = new Date();
        const today = now.getFullYear() + '-' +
                      String(now.getMonth() + 1).padStart(2, '0') + '-' +
                      String(now.getDate()).padStart(2, '0');

        let selectedDate = dates[0];

        dates.forEach(function(date) {
          const opt = document.createElement('option');
          opt.value = date;
          opt.textContent = date;
          if (date === today) {
            opt.selected = true;
            selectedDate = date;
          }
          select.appendChild(opt);
        });

        loadReport(selectedDate);

        select.addEventListener('change', function() {
          loadReport(this.value);
        });

      } catch (error) {
        container.innerHTML = '<div class="message">Error loading dates.json<br><small>' + error.message + '</small></div>';
      }
    }

    async function loadReport(date) {
      const container = document.getElementById('report-container');
      container.innerHTML = '<div class="message">Loading report for ' + date + '...</div>';

      try {
        const res = await fetch('reports/' + date + '.html');
        if (!res.ok) throw new Error('File not found');
        const html = await res.text();
        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = '<div class="message">No report found for ' + date + '</div>';
      }
    }
  </script>

</body>
</html>
