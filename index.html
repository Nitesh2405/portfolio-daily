<script>
  async function init() {
    try {
      const res = await fetch('dates.json');
      const dates = await res.json();

      // Sort newest first
      dates.sort((a, b) => b.localeCompare(a));

      const select = document.getElementById('dateSelect');
      select.innerHTML = '';

      // Get today's date in YYYY-MM-DD (local time)
      const today = new Date();
      const todayStr = today.toISOString().split('T')[0];

      let defaultDate = dates[0]; // fallback to newest

      dates.forEach((date) => {
        const option = document.createElement('option');
        option.value = date;
        option.textContent = date;

        // Prefer today's date if it exists in the list
        if (date === todayStr) {
          option.selected = true;
          defaultDate = date;
        }

        select.appendChild(option);
      });

      // If today was not found, select the newest one
      if (defaultDate !== todayStr) {
        select.value = defaultDate;
      }

      // Load the chosen report
      loadReport(defaultDate);

    } catch (err) {
      document.getElementById('report-container').innerHTML =
        '<div class="error">Could not load dates.json</div>';
    }
  }

  async function loadReport(date) {
    const container = document.getElementById('report-container');
    container.innerHTML = '<div class="loading">Loading report…</div>';

    try {
      const response = await fetch(`reports/${date}.html`);
      if (!response.ok) throw new Error('Report not found');
      const html = await response.text();
      container.innerHTML = html;
    } catch (err) {
      container.innerHTML = `<div class="error">No report found for ${date}</div>`;
    }
  }

  init();
</script>
